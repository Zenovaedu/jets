<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enter Exam Code — UTME CBT Challenge 2.0 | Zenova Study</title>
<link rel="icon" href="logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0A1628; --navy-2:#132542; --gold:#E7B93C; --gold-deep:#B9862A;
    --paper:#FAF8F1; --card:#FFFFFF; --ink:#101826; --ink-soft:#5B6579;
    --line:#E7E2D6; --red:#C4483A;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--navy); color:var(--ink); font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:24px;
    position:relative; overflow:hidden;
  }
  h1,h2{font-family:'Space Grotesk', sans-serif; letter-spacing:-0.01em;}
  .mono{font-family:'JetBrains Mono',monospace;}

  #authGate{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;z-index:100;}
  #authGate.hidden{display:none;}
  .gate-spinner{width:34px;height:34px;border:3px solid rgba(255,255,255,0.15);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #appShell{display:none;}
  #appShell.visible{display:flex;}

  .bg-watermark{position:absolute;top:-100px;right:-120px;width:420px;height:420px;opacity:0.05;pointer-events:none;filter:brightness(0) invert(1);}

  .card{
    background:var(--card); border-radius:18px; padding:40px 36px;
    max-width:400px; width:100%; position:relative; z-index:2; text-align:center;
  }
  .brand{display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:24px;}
  .brand img{height:28px; width:28px; object-fit:contain;}
  .brand span{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px; color:var(--navy);}

  .icon-badge{width:56px;height:56px;margin:0 auto 18px;background:var(--navy);border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--gold);}
  .icon-badge svg{width:26px;height:26px;}

  h2{font-size:22px; font-weight:700; color:var(--navy); margin-bottom:8px;}
  .sub{color:var(--ink-soft); font-size:14px; margin-bottom:28px; line-height:1.55;}

  .code-input{
    width:100%; padding:16px 14px; border:1.5px solid var(--line); border-radius:12px;
    font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:700; letter-spacing:0.18em;
    text-align:center; text-transform:uppercase; color:var(--navy); background:#FCFBF6;
    transition:border-color 0.15s ease, box-shadow 0.15s ease; margin-bottom:16px;
  }
  .code-input::placeholder{letter-spacing:0.1em; font-weight:600; color:#C2BCA9;}
  .code-input:focus{outline:none; border-color:var(--gold-deep); box-shadow:0 0 0 3px rgba(185,134,42,0.14); background:#fff;}

  .btn-primary{
    width:100%; background:var(--navy); color:#fff; border:none; padding:14px; border-radius:10px;
    font-family:'Inter',sans-serif; font-weight:700; font-size:14.5px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition:background 0.15s ease, transform 0.15s ease;
  }
  .btn-primary:hover{background:var(--navy-2); transform:translateY(-1px);}
  .btn-primary:disabled{opacity:0.6; cursor:not-allowed; transform:none;}
  .btn-primary:focus-visible{outline:2px solid var(--navy);outline-offset:2px;}

  .alert{
    display:none; align-items:flex-start; gap:10px; padding:12px 14px; border-radius:10px;
    font-size:13.5px; line-height:1.5; margin-bottom:16px; text-align:left;
    background:#FBEAE7; color:#9A3226; border:1px solid #F0C9C1;
  }
  .alert.show{display:flex;}
  .alert svg{width:18px; height:18px; flex-shrink:0; margin-top:1px;}

  .spinner{width:15px; height:15px; border:2px solid rgba(255,255,255,0.4); border-top-color:#fff; border-radius:50%; animation:spin 0.7s linear infinite; display:none;}
  .btn-loading .spinner{display:inline-block;}
  .btn-loading .btn-label{display:none;}

  .help-row{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:22px;font-size:12.5px;color:var(--ink-soft);}
  .help-row a{color:var(--gold-deep);font-weight:600;text-decoration:none;}
  .help-row a:hover{text-decoration:underline;}

  .back-link{display:flex; align-items:center; gap:6px; color:var(--ink-soft); font-size:13px; text-decoration:none; margin-top:14px; justify-content:center;}
  .back-link:hover{color:var(--navy);}
</style>
</head>
<body>

<div id="authGate"><div class="gate-spinner"></div></div>

<div id="appShell">
  <img class="bg-watermark" src="logo.png" alt="">

  <div class="card">
    <div class="brand">
      <img src="logo.png" alt="Zenova Study">
      <span>ZENOVA STUDY</span>
    </div>

    <div class="icon-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>

    <h2>Enter your exam code</h2>
    <p class="sub">Every participant gets a unique code shared in the Zenova Study JAMB group. Enter it below to unlock your dashboard.</p>

    <div class="alert error" id="errorAlert">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
      <span id="errorText">Invalid code. Please check and try again.</span>
    </div>

    <form id="codeForm" novalidate>
      <input type="text" class="code-input" id="codeInput" placeholder="ZNV0000" maxlength="8" autocomplete="off" autocapitalize="characters" required>
      <button type="submit" class="btn-primary" id="submitBtn">
        <span class="btn-label">Unlock dashboard</span>
        <span class="spinner"></span>
      </button>
    </form>

    <div class="help-row">
      Don't have a code? <a href="https://chat.whatsapp.com/GKox4rCMx4lAlGcWTOPkB9" target="_blank" rel="noopener">Get it in the JAMB group</a>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAJutYkF94mnZiBNdl_XgWOkoRlnyODGYc",
    authDomain: "zenova-competition-f2197.firebaseapp.com",
    projectId: "zenova-competition-f2197",
    storageBucket: "zenova-competition-f2197.firebasestorage.app",
    messagingSenderId: "385389095336",
    appId: "1:385389095336:web:63e754823a3cbaea66959d"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const LOGIN_URL = "login.html";
  const DASHBOARD_URL = "dashboard.html";

  // NOTE: this list lives in the page's JS, so it's visible to anyone who
  // views the page source — fine for a low-stakes gate, but not a secret.
  const VALID_CODES = new Set([
    "ZNV7K2M9","ZNV4P8Q6","ZNV9X3L7","ZNV2R6T8","ZNV5H9W3",
    "ZNV8C4N2","ZNV3F7J9","ZNV6M2K5","ZNV1Q8V4","ZNV7D3P6",
    "ZNV9B5R2","ZNV4L7X8","ZNV2N9C5","ZNV6T4H7","ZNV8J3M1",
    "ZNV5Q7K9","ZNV3W6P2","ZNV9F4L8","ZNV1R5N7","ZNV6X2C9",
    "ZNV4H8T3","ZNV7M5Q1","ZNV2P6J8","ZNV8L3R5","ZNV5C9W2",
    "ZNV3K7D4","ZNV9N2H6","ZNV4V8F1","ZNV6Q3X7","ZNV2T5M9"
  ]);

  let currentUser = null;

  onAuthStateChanged(auth, async (user) => {
    if(!user){
      window.location.href = LOGIN_URL;
      return;
    }
    currentUser = user;

    // Already verified? Skip straight to the dashboard.
    try{
      const snap = await getDoc(doc(db, "users", user.uid));
      if(snap.exists() && snap.data().codeVerified){
        window.location.href = DASHBOARD_URL;
        return;
      }
    }catch(err){
      console.error('Failed to check code status:', err);
    }

    document.getElementById('authGate').classList.add('hidden');
    document.getElementById('appShell').classList.add('visible');
  });

  const codeInput = document.getElementById('codeInput');
  codeInput.addEventListener('input', () => {
    codeInput.value = codeInput.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  });

  function showError(msg){
    document.getElementById('errorText').textContent = msg;
    document.getElementById('errorAlert').classList.add('show');
  }
  function clearError(){
    document.getElementById('errorAlert').classList.remove('show');
  }
  function setLoading(btn, loading){
    btn.disabled = loading;
    btn.classList.toggle('btn-loading', loading);
  }

  document.getElementById('codeForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    clearError();

    const code = codeInput.value.trim().toUpperCase();
    if(!code){
      showError('Please enter your exam code.');
      return;
    }

    const btn = document.getElementById('submitBtn');
    setLoading(btn, true);

    if(!VALID_CODES.has(code)){
      showError("That code isn't recognized. Double-check it and try again, or ask in the JAMB group.");
      setLoading(btn, false);
      return;
    }

    try{
      await setDoc(doc(db, "users", currentUser.uid), {
        codeVerified: true,
        examCode: code,
        codeVerifiedAt: serverTimestamp()
      }, { merge: true });
      window.location.href = DASHBOARD_URL;
    }catch(err){
      console.error('Failed to save code verification:', err);
      showError('Could not verify your code. Check your connection and try again.');
      setLoading(btn, false);
    }
  });
</script>

</body>
</html>
