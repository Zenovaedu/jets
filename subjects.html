<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose Subjects — UTME CBT Challenge 2.0 | Zenova Study</title>
<link rel="icon" href="logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0A1628;
    --navy-2:#132542;
    --gold:#E7B93C;
    --gold-deep:#B9862A;
    --paper:#FAF8F1;
    --card:#FFFFFF;
    --ink:#101826;
    --ink-soft:#5B6579;
    --line:#E7E2D6;
    --red:#C4483A;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;}
  h1,h2,.display{font-family:'Space Grotesk',sans-serif;letter-spacing:-0.01em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;}}

  /* ---------- AUTH GATE ---------- */
  #authGate{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;justify-content:center;z-index:100;}
  #authGate.hidden{display:none;}
  .gate-spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--gold-deep);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #appShell{display:none;}
  #appShell.visible{display:block;}

  /* ---------- NAV ---------- */
  .nav{position:sticky;top:0;z-index:50;background:rgba(250,248,241,0.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .nav-inner{max-width:820px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;}
  .nav-logo{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;color:var(--navy);}
  .nav-logo img{height:28px;width:28px;object-fit:contain;}
  .nav-back{display:flex;align-items:center;gap:6px;color:var(--ink-soft);font-size:13.5px;font-weight:600;text-decoration:none;}
  .nav-back:hover{color:var(--navy);}
  .nav-back svg{width:16px;height:16px;}

  /* ---------- HEADER ---------- */
  .head{max-width:820px;margin:0 auto;padding:44px 24px 8px;}
  .head h1{font-size:clamp(24px,3.6vw,30px);font-weight:700;color:var(--navy);margin-bottom:8px;}
  .head p{color:var(--ink-soft);font-size:14.5px;max-width:480px;}

  /* ---------- PROGRESS ---------- */
  .progress-wrap{max-width:820px;margin:24px auto 0;padding:0 24px;}
  .progress-track{height:8px;background:var(--line);border-radius:100px;overflow:hidden;}
  .progress-fill{height:100%;width:25%;background:var(--gold-deep);border-radius:100px;transition:width .25s ease;}
  .progress-fill.complete{background:var(--green,#1E8E5A);}
  .progress-meta{display:flex;justify-content:space-between;margin-top:10px;font-size:12.5px;color:var(--ink-soft);font-weight:600;}
  .progress-meta span:last-child{color:var(--navy);}

  /* ---------- MAIN ---------- */
  .main{max-width:820px;margin:0 auto;padding:28px 24px 140px;}

  .alert{display:none;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:10px;font-size:13.5px;line-height:1.5;margin-bottom:18px;
    background:#FBEAE7;color:#9A3226;border:1px solid #F0C9C1;}
  .alert.show{display:flex;}
  .alert svg{width:18px;height:18px;flex-shrink:0;margin-top:1px;}

  .locked-row{display:flex;align-items:center;gap:14px;background:rgba(30,142,90,0.08);border:1px solid rgba(30,142,90,0.25);
    border-radius:14px;padding:16px;margin-bottom:22px;}
  .locked-icon{width:40px;height:40px;border-radius:10px;background:#1E8E5A;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .locked-icon svg{width:19px;height:19px;}
  .locked-text .t{font-weight:700;font-size:14.5px;color:var(--navy);}
  .locked-text .d{font-size:12.5px;color:var(--ink-soft);margin-top:1px;}

  .subject-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  @media(max-width:560px){.subject-grid{grid-template-columns:1fr;}}

  .subject-card{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;
    padding:14px 16px;cursor:pointer;text-align:left;font-family:'Inter',sans-serif;transition:border-color .15s ease,transform .15s ease,background .15s ease;}
  .subject-card:hover{border-color:#C5CCDA;transform:translateY(-1px);}
  .subject-card:focus-visible{outline:2px solid var(--navy);outline-offset:2px;}
  .subject-card.selected{border-color:var(--gold-deep);background:rgba(231,185,60,0.07);}
  .subject-card.disabled{opacity:0.4;pointer-events:none;}

  .subject-icon{width:36px;height:36px;border-radius:9px;background:var(--paper);color:var(--ink-soft);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:11px;transition:background .15s ease,color .15s ease;}
  .subject-card.selected .subject-icon{background:var(--navy);color:var(--gold);}
  .subject-name{flex:1;font-weight:600;font-size:14.5px;color:var(--navy);}
  .subject-check{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;
    background:#fff;transition:background .15s ease,border-color .15s ease;}
  .subject-card.selected .subject-check{background:var(--gold-deep);border-color:var(--gold-deep);}
  .subject-check svg{width:11px;height:11px;color:#fff;opacity:0;transition:opacity .1s ease;}
  .subject-card.selected .subject-check svg{opacity:1;}

  /* ---------- STICKY FOOTER ---------- */
  .footer-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(250,248,241,0.95);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);padding:16px 24px;z-index:40;}
  .footer-inner{max-width:820px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .footer-count{font-size:13.5px;color:var(--ink-soft);}
  .footer-count b{color:var(--navy);}
  .btn-primary{background:var(--navy);color:#fff;border:none;padding:13px 26px;border-radius:10px;font-family:'Inter',sans-serif;
    font-weight:700;font-size:14.5px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .15s ease,transform .15s ease;}
  .btn-primary:hover:not(:disabled){background:var(--navy-2);transform:translateY(-1px);}
  .btn-primary:disabled{opacity:0.4;cursor:not-allowed;}
  .btn-primary:focus-visible{outline:2px solid var(--navy);outline-offset:2px;}
  .spinner{width:15px;height:15px;border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none;}
  .btn-loading .spinner{display:inline-block;}
  .btn-loading .btn-label{display:none;}
</style>
</head>
<body>

<div id="authGate"><div class="gate-spinner"></div></div>

<div id="appShell">

  <nav class="nav">
    <div class="nav-inner">
      <div class="nav-logo"><img src="logo.png" alt="Zenova Study">ZENOVA STUDY</div>
      <a class="nav-back" href="dashboard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Dashboard
      </a>
    </div>
  </nav>

  <div class="head">
    <h1>Choose your 4 subjects</h1>
    <p>English is compulsory. Pick exactly 3 more — just like the real JAMB.</p>
  </div>

  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-meta">
      <span><span id="progressCount">0</span> of 3 selected</span>
      <span id="progressHint">Pick 3 more subjects</span>
    </div>
  </div>

  <div class="main">
    <div class="alert" id="errorAlert">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
      <span id="errorText">Something went wrong.</span>
    </div>

    <div class="locked-row">
      <span class="locked-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg></span>
      <div class="locked-text"><div class="t">English Language</div><div class="d">Compulsory for every candidate — already locked in</div></div>
    </div>

    <div class="subject-grid" id="subjectGrid"></div>
  </div>

  <div class="footer-bar">
    <div class="footer-inner">
      <div class="footer-count">English + <b id="footerCount">0</b> other subject<span id="footerPlural">s</span> selected</div>
      <button class="btn-primary" id="startBtn" disabled>
        <span class="btn-label">Continue to exam</span>
        <svg class="btn-label" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px;"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        <span class="spinner"></span>
      </button>
    </div>
  </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAJutYkF94mnZiBNdl_XgWOkoRlnyODGYc",
    authDomain: "zenova-competition-f2197.firebaseapp.com",
    projectId: "zenova-competition-f2197",
    storageBucket: "zenova-competition-f2197.firebasestorage.app",
    messagingSenderId: "385389095336",
    appId: "1:385389095336:web:63e754823a3cbaea66959d"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const LOGIN_URL = "login.html";
  const EXAM_URL = "exam.html";
  const MAX_OPTIONAL = 3;

  const OPTIONAL_SUBJECTS = [
    { id: "maths", name: "Mathematics", abbr: "Mth" },
    { id: "physics", name: "Physics", abbr: "Phy" },
    { id: "biology", name: "Biology", abbr: "Bio" },
    { id: "chemistry", name: "Chemistry", abbr: "Chm" },
    { id: "geography", name: "Geography", abbr: "Geo" },
    { id: "economics", name: "Economics", abbr: "Eco" },
    { id: "literature", name: "Literature in English", abbr: "Lit" },
    { id: "government", name: "Government", abbr: "Gov" },
    { id: "history", name: "History", abbr: "Hist" },
    { id: "agric", name: "Agricultural Science", abbr: "Agric" },
    { id: "crs", name: "Christian Religious Studies", abbr: "CRS" },
    { id: "commerce", name: "Commerce", abbr: "Com" },
    { id: "irk", name: "Islamic Religious Knowledge", abbr: "IRK" },
    { id: "accounting", name: "Accounting", abbr: "Acc" }
  ];

  let selected = new Set();
  let currentUser = null;

  // ---------- Render subject grid ----------
  const grid = document.getElementById('subjectGrid');
  OPTIONAL_SUBJECTS.forEach(subj => {
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'subject-card';
    card.dataset.id = subj.id;
    card.innerHTML = `
      <span class="subject-icon">${subj.abbr}</span>
      <span class="subject-name">${subj.name}</span>
      <span class="subject-check">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>
      </span>
    `;
    card.addEventListener('click', () => toggleSubject(subj.id, card));
    grid.appendChild(card);
  });

  function toggleSubject(id, card){
    clearError();
    if(selected.has(id)){
      selected.delete(id);
      card.classList.remove('selected');
    }else{
      if(selected.size >= MAX_OPTIONAL){
        showError(`You can only pick ${MAX_OPTIONAL} subjects besides English. Remove one first.`);
        return;
      }
      selected.add(id);
      card.classList.add('selected');
    }
    updateUI();
  }

  function updateUI(){
    const count = selected.size;
    document.getElementById('progressCount').textContent = count;
    document.getElementById('footerCount').textContent = count;
    document.getElementById('footerPlural').textContent = count === 1 ? '' : 's';

    const fill = document.getElementById('progressFill');
    const pct = 25 + (count / MAX_OPTIONAL) * 75;
    fill.style.width = pct + '%';
    fill.classList.toggle('complete', count === MAX_OPTIONAL);

    const hint = document.getElementById('progressHint');
    hint.textContent = count === MAX_OPTIONAL ? "All set — ready to start" : `Pick ${MAX_OPTIONAL - count} more subject${MAX_OPTIONAL - count === 1 ? '' : 's'}`;

    document.querySelectorAll('.subject-card').forEach(card => {
      const isSelected = selected.has(card.dataset.id);
      card.classList.toggle('disabled', count >= MAX_OPTIONAL && !isSelected);
    });

    document.getElementById('startBtn').disabled = count !== MAX_OPTIONAL;
  }

  function showError(msg){
    const el = document.getElementById('errorAlert');
    document.getElementById('errorText').textContent = msg;
    el.classList.add('show');
  }
  function clearError(){
    document.getElementById('errorAlert').classList.remove('show');
  }

  // ---------- Auth gate + load existing selection ----------
  onAuthStateChanged(auth, async (user) => {
    if(!user){
      window.location.href = LOGIN_URL;
      return;
    }
    currentUser = user;
    document.getElementById('authGate').classList.add('hidden');
    document.getElementById('appShell').classList.add('visible');

    try{
      const ref = doc(db, "users", user.uid);
      const snap = await getDoc(ref);
      if(snap.exists()){
        const data = snap.data();
        if(Array.isArray(data.subjects)){
          data.subjects.forEach(id => {
            const card = grid.querySelector(`[data-id="${id}"]`);
            if(card){
              selected.add(id);
              card.classList.add('selected');
            }
          });
          updateUI();
        }
      }
    }catch(err){
      console.error('Failed to load existing subjects:', err);
    }
  });

  // ---------- Start exam ----------
  const startBtn = document.getElementById('startBtn');
  startBtn.addEventListener('click', async () => {
    if(selected.size !== MAX_OPTIONAL || !currentUser) return;
    clearError();

    startBtn.disabled = true;
    startBtn.classList.add('btn-loading');

    try{
      const subjectsArray = ["english", ...Array.from(selected)];
      const ref = doc(db, "users", currentUser.uid);
      await setDoc(ref, {
        subjects: subjectsArray,
        subjectsUpdatedAt: serverTimestamp()
      }, { merge: true });

      window.location.href = EXAM_URL;
    }catch(err){
      console.error('Failed to save subjects:', err);
      showError('Could not save your subjects. Check your connection and try again.');
      startBtn.disabled = false;
      startBtn.classList.remove('btn-loading');
    }
  });
</script>

</body>
</html>
